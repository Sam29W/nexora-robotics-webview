  <path d="M271 369 L240 379 L248 451 L260 486 L297 481 L294 433Z" fill="url(#armor)" stroke="#91a6bb" stroke-width="2"/>
  <path d="M190 403 L230 412 M250 412 L290 403" stroke="#42566c" stroke-width="6"/>
  <path d="M183 481 L220 486 L225 523 L204 537 L170 532 L166 514Z" fill="url(#dark)" stroke="#71869c" stroke-width="2"/>
  <path d="M260 486 L297 481 L314 514 L310 532 L276 537 L255 523Z" fill="url(#dark)" stroke="#71869c" stroke-width="2"/>
  <path d="M174 522 L216 527 M264 527 L306 522" stroke="#62e8ff" stroke-width="4" stroke-linecap="round"/>

  <!-- Mechanical detail -->
  <path d="M193 291 L207 305 M287 291 L273 305 M207 389 L219 397 M273 389 L261 397" stroke="#5bdfff" stroke-width="3"/>
  <circle cx="240" cy="303" r="7" fill="#58e5ff"/>
